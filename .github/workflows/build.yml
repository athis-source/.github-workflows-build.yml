name: Build iHaiDeeZ PS4SX2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies and LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl git cmake ninja-build python3 rsync build-essential pkg-config software-properties-common lsb-release gnupg
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 100
          sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-21 100

      - name: Install OpenOrbis PS4 Toolchain
        run: |
          sudo mkdir -p /opt/pacbrew/ps4
          wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.3/OpenOrbis-PS4-Toolchain-Linux-v0.5.3.tar.gz -O /tmp/oo.tar.gz
          sudo tar -xzf /tmp/oo.tar.gz -C /opt/pacbrew/ps4
          if [ -d "/opt/pacbrew/ps4/OpenOrbis-PS4-Toolchain" ]; then
            sudo mv /opt/pacbrew/ps4/OpenOrbis-PS4-Toolchain /opt/pacbrew/ps4/openorbis
          fi

      - name: Inspect ps4 build scripts
        run: |
          ls -la ps4/
          cat ps4/build-ps4.sh
          cat ps4/Makefile.ps4

      - name: Compile and Package PS4SX2
        env:
          OPENORBIS: /opt/pacbrew/ps4/openorbis
        run: |
          chmod +x ps4/build-ps4.sh
          ./ps4/build-ps4.sh package

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iHaiDeeZ-PS4SX2-PKG
          path: "**/*.pkg"
