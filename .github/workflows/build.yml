name: Build iHaiDeeZ PS4SX2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies and LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl git cmake ninja-build python3 rsync build-essential pkg-config software-properties-common lsb-release gnupg
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 100
          sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-21 100

      - name: Setup OpenOrbis Directory
        run: |
          mkdir -p /home/runner/openorbis
          sudo mkdir -p /opt/pacbrew/ps4
          sudo ln -s /home/runner/openorbis /opt/pacbrew/ps4/openorbis || true

      - name: Compile and Package PS4SX2
        env:
          OPENORBIS: /home/runner/openorbis
        run: |
          chmod +x ps4/build-ps4.sh
          ./ps4/build-ps4.sh package

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iHaiDeeZ-PS4SX2-PKG
          path: "**/*.pkg"
